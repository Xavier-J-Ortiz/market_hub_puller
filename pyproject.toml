[project]
name = "market-hub-puller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.uv]
no-binary-package = ["pydantic-core"]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "basedpyright",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "D",
    "PL",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F811"]
